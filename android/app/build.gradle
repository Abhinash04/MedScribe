apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.medscribe"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.medscribe"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        // Defaults are the empty string on purpose: '' resolves to
        // NOT_CONFIGURED, which is the honest state and lets a fresh clone build
        // with no local.properties at all. A placeholder that looked like a real
        // key would 401 at runtime AND flip isTranslationAvailable() to true,
        // making the UI promise what it cannot deliver.
        // See android/local.properties.example.
        buildConfigField "String",
            "ANUVADINI_STT_TOKEN",
            "\"${localProperties.getProperty('ANUVADINI_STT_TOKEN', '')}\""
        buildConfigField "String",
            "PRAVAH_API_KEY",
            "\"${localProperties.getProperty('PRAVAH_API_KEY', '')}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}
dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
